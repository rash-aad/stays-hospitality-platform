services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hp
      POSTGRES_PASSWORD: hp_dev_password
      POSTGRES_DB: hp
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
